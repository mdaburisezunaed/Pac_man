apply plugin: 'com.android.application'

android {
    namespace 'com.zunaed.pacman'
    compileSdk 34

    defaultConfig {
        applicationId "com.zunaed.pacman"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
